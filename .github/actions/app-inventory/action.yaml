---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: App Inventory
description: Return a JSON array of app names from the apps directory

outputs:
  apps:
    description: App Inventory
    value: ${{ steps.inventory.outputs.apps }}

runs:
  using: composite
  steps:
    - name: App Inventory
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      id: inventory
      with:
        script: |-
          const fs = require('fs');
          const path = require('path');

          function scanDirectory(dir) {
              try {
                  return fs.readdirSync(dir, { withFileTypes: true })
                      .filter((entry) => entry.isDirectory())
                      .map((entry) => entry.name);
              } catch (error) {
                  if (error.code === 'ENOENT') {
                      return [];
                  }
                  core.setFailed(`Error reading directory ${dir}: ${error.message}`);
                  return [];
              }
          }

          const roots = ['apps', 'home-assistant-apps'];
          const apps = roots
              .flatMap((root) => scanDirectory(path.resolve(process.cwd(), root)))
              .sort();
          core.setOutput('apps', JSON.stringify(apps));
