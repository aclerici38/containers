[settings]
experimental = true
unix_default_inline_shell_args = "bash -c -o errexit -o pipefail -o nounset"

[tools]
gh = "2.95.0"
go = "1.26.4"
jq = "1.8.1"
lefthook = "2.1.9"
node = "26.3.1"
oxfmt = "0.66.0"
shellcheck = "0.11.0"
yq = "4.53.3"
zizmor = "1.25.2"

[tasks.local-build]
description = "Build and test an app locally"
dir = "{{config_root}}/.cache"
usage = '''
arg "<path>"
'''
run = '''
rsync -aqIP {{config_root}}/include/ {{config_root}}/"$usage_path"/ .
docker buildx bake --no-cache --metadata-file docker-bake.json --set=*.output=type=docker --load
TEST_IMAGE="$(jq -r '."image-local"."image.name" | sub("^docker.io/library/"; "")' docker-bake.json)" go test -v {{config_root}}/"$usage_path"/...
'''

[tasks.remote-build]
description = "Trigger a remote build"
usage = '''
arg "<path>"
arg "[release]" help="release flag (default: false)"
'''
run = 'gh workflow run release.yaml -f app="$usage_path" -f release="${usage_release:-false}"'

[hooks]
postinstall = ["mkdir -p {{config_root}}/.cache", "lefthook install"]
